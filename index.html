:root{--head:#2b2118;--bg:#f6f1e7;--panel:#fffaf0;--text:#2b2118;--muted:#7a6a58;--wood:#8b5a2b;--brass:#b8892c;--brass-soft:#f1e2bd;--line:#e1d4bd;--err:#a33;--ok:#2e7d4f;--hl:#1fd11f;--hl-ink:#062b06;--tu-low:#2f6fd6;--tu-high:#c0392b;--fb-wood-1:#5a3a22;--fb-wood-2:#3e2716;--fb-line:rgba(241,226,189,.25);--fb-blue:#2f6fd6;--fb-string:#e8d9b5;}

:root[data-theme="dark"]{--head:#ffffff;--bg:#1c1712;--panel:#262019;--text:#f4f2ee;--muted:#a9a49c;--wood:#c48a52;--brass:#d9ad55;--brass-soft:#3d3222;--line:#3b3127;--err:#e77;--ok:#3ee88a;--hl:#39ff14;--hl-ink:#062b06;--tu-low:#4da3ff;--tu-high:#ff5a48;--fb-wood-1:#4a3020;--fb-wood-2:#2c1c10;--fb-line:rgba(241,226,189,.22);--fb-blue:#6ea2ff;--fb-string:#e8d9b5;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:.005em}
.ds{max-width:920px;margin:0 auto;padding:24px 16px 48px}
.ds-title{margin:0 0 16px;font-size:1.4rem;color:var(--head)}
.ds-head{position:relative;margin:0 0 18px;padding-right:9.5rem}
.ds-head .ds-title{margin:0;display:flex;flex-direction:column;gap:2px;line-height:1.1}
.ds-brand{font-size:.72rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
.ds-app{font-size:1.75rem;font-weight:300;letter-spacing:.02em;color:var(--head)}
.ds-lang{position:absolute;top:2px;right:0;display:flex;gap:2px}
.ds-lang button{font:inherit;font-size:.72rem;letter-spacing:.06em;padding:3px 6px;border:0;border-radius:6px;background:none;color:var(--muted);opacity:.7;cursor:pointer}
.ds-lang button.active{color:var(--head);opacity:1;background:color-mix(in srgb,var(--head) 10%,transparent)}
@media (max-width:420px){.ds-app{font-size:1.45rem}.ds-head{padding-right:8.5rem}}
.ds-stage{display:flex;gap:12px;align-items:stretch;margin-bottom:16px}
.ds-now,.ds-next{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ds-now{flex:2;border-color:var(--brass)}.ds-next{flex:1}
.ds-label{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ds-note{font-size:clamp(4rem,18vw,7.5rem);font-weight:600;line-height:1.05;color:var(--head)}
.ds-note-sm{font-size:clamp(2rem,9vw,3.2rem);font-weight:600;color:var(--muted)}
.ds-pos{color:var(--muted);font-variant-numeric:tabular-nums}
.ds-row{display:flex;gap:10px;align-items:center;margin:12px 0}
.ds-wrap{flex-wrap:wrap;gap:14px}
.ds-btn{font:inherit;font-size:1.3rem;padding:14px 18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
.ds-main{flex:1;font-size:1.1rem;font-weight:600;background:var(--brass);color:#1c1712;border-color:var(--brass)}
.ds-main.on{background:var(--wood);border-color:var(--wood);color:#fff}
.ds-btn-sm,select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.ds-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.ds-chip{font:inherit;min-width:44px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
.ds-chip.active{background:var(--brass-soft);border-color:var(--brass);font-weight:700}
.ds-field{display:block}.ds-field span{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
textarea{width:100%;font:inherit;font-size:1.05rem;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.ds-error{color:var(--err);margin:4px 0}
.ds-hint{font-size:.85rem;color:var(--muted);margin-top:18px}
.ds-footer{margin-top:32px;padding-top:12px;border-top:1px solid var(--line);text-align:center;font-size:.85rem;color:var(--muted)}
.gt{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.gt-lagen{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.gt-lagen .ds-label{margin-right:4px}
.ds-chip.half{color:var(--fb-blue);border-color:var(--fb-blue)}
.ds-chip.half.active{background:var(--fb-blue);color:#fff}
.fb-wrap{overflow-x:auto;margin:6px -4px;-webkit-overflow-scrolling:touch}
.fb{display:block;width:100%;min-width:640px;height:auto}
.fb-note:hover circle{filter:brightness(1.08)}
.gt-seq{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.gt-n{padding:2px 7px;border-radius:6px;background:var(--brass-soft);font-weight:600;font-size:.9rem}
.gt-n sub{font-size:.65rem;color:var(--wood);margin-left:1px}
.gt-n.active{background:var(--hl);color:var(--hl-ink);box-shadow:0 0 6px var(--hl),0 0 16px var(--hl)}.gt-n.active sub{color:var(--hl-ink)}
.gt-sn.cur{filter:drop-shadow(0 0 2px var(--hl)) drop-shadow(0 0 6px var(--hl)) drop-shadow(0 0 12px var(--hl))}.fb-cur{filter:drop-shadow(0 0 4px var(--hl)) drop-shadow(0 0 12px var(--hl))}
.gt-n.turn{margin-left:10px}
.ds-btn-sm.on{background:var(--wood);color:#fff;border-color:var(--wood)}
.mt{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.mt-sounds{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.mt-main{display:flex;align-items:center;justify-content:center;gap:16px}
.mt-bpm{display:flex;flex-direction:column;align-items:center;min-width:7ch}
.mt-num{font-size:3.2rem;font-weight:300;line-height:1;color:var(--head);font-variant-numeric:tabular-nums}
.mt input.mt-slider{display:block;width:100%;max-width:none;margin:10px 0}
.mt-dots{display:flex;justify-content:center;gap:10px;margin:6px 0 4px;flex-wrap:wrap}
.mt-dot{width:18px;height:18px;border-radius:50%;background:var(--brass-soft);border:1px solid var(--line);transition:background .05s}
.mt-dot.one{border-color:var(--brass);border-width:2px}
.mt-dot.on{background:var(--wood)}
.mt-dot.one.on{background:var(--brass)}
.mt-light-wrap{display:flex;justify-content:center;margin:10px 0 6px}
.mt-light{width:84px;height:84px;border-radius:50%;background:color-mix(in srgb,var(--ok) 12%,transparent);border:2px solid color-mix(in srgb,var(--ok) 45%,transparent)}
.mt-light.go{animation:mtflash .22s ease-out}
.mt-light.go.one{animation:mtflash1 .3s ease-out}
@keyframes mtflash{0%{background:color-mix(in srgb,var(--ok) 80%,transparent);box-shadow:0 0 28px var(--ok)}100%{background:color-mix(in srgb,var(--ok) 12%,transparent);box-shadow:none}}
@keyframes mtflash1{0%{background:var(--ok);box-shadow:0 0 48px var(--ok);transform:scale(1.08)}100%{background:color-mix(in srgb,var(--ok) 12%,transparent);box-shadow:none;transform:none}}
.ds-nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;margin:-4px 0 12px;background:var(--bg)}
.ds-nav a{font-size:.9rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);text-decoration:none}
.ds-nav a.active{border-color:var(--brass);color:var(--head);background:var(--brass-soft)}
.ds-nav a.home-back{border-color:transparent;background:none;color:var(--muted);padding-left:2px}
[hidden]{display:none!important}
.mt-mini{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.mt-mini .ds-label{margin-right:2px}
.mt-mini .ds-btn-sm{min-width:40px}
.mt-mini-go.on{border-color:var(--brass);color:var(--head);background:var(--brass-soft)}
.mt-mini-bpm{min-width:2.4em;text-align:center;font-size:1.5rem;font-weight:300;color:var(--head);font-variant-numeric:tabular-nums}
.mt-mini-light{width:18px;height:18px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ok) 60%,transparent);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.mt-mini-light.go{animation:mtflash .22s ease-out}.mt-mini-light.go.one{animation:mtflash1 .3s ease-out}
.mt-mini .mt-slider{flex:1 1 100%;margin:0}
.mt-mini-more{font-size:.85rem;color:var(--muted)}
.ds-head .ds-title{cursor:pointer}
.home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:8px 0 24px}
.home-tile{position:relative;display:flex;flex-direction:column;gap:6px;min-height:150px;padding:18px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);text-decoration:none;transition:border-color .15s,transform .15s}
.home-tile:hover,.home-tile:focus-visible{border-color:var(--brass)}
.home-tile:active{transform:scale(.98)}
.home-ico{width:44px;height:44px;color:var(--brass);margin-bottom:4px}
.home-name{font-size:1.25rem;font-weight:500;color:var(--head)}
.home-desc{font-size:.85rem;line-height:1.35;color:var(--muted)}
.home-run{position:absolute;top:12px;right:12px;font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
@media (max-width:420px){.home{gap:10px}.home-tile{min-height:132px;padding:14px 12px}.home-name{font-size:1.1rem}}
section{scroll-margin-top:56px}
.ds-drone{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:18px}
.ds-drone .ds-now,.ds-drone .ds-next{background:var(--bg)}
.ds-note.chord{font-size:clamp(2rem,8vw,3.6rem);line-height:1.2;text-align:center}
.gt-tabs{display:flex;gap:4px;margin:6px 0 10px;border-bottom:1px solid var(--line)}
.gt-tab{font:inherit;font-weight:600;padding:8px 14px;border:none;border-bottom:3px solid transparent;background:none;color:var(--muted);cursor:pointer}
.gt-tab.active{color:var(--head);border-bottom-color:var(--brass)}
.rg-list{margin:8px 0 0;padding-left:18px;font-size:.92rem}
.rg-list li{margin:3px 0}
.tu-live{margin:10px 0 4px}
.tu-chart{margin:6px 0 2px}.tu-chart .tu-trace{flex:1;margin-top:0}.tu-labels{color:var(--muted);font:600 .75rem system-ui,sans-serif}
.dy.dy-in{margin:6px 0 0;padding:0 4px;border:0;background:none}.dy.dy-in .dy-now{font-size:1.8rem}
.tu-live .dy-chart .dy-trace{height:min(30vh,180px)}
.tu-axis{display:flex;justify-content:space-between;margin-left:calc(2.4em + 6px);font-size:.75rem;color:var(--muted)}
.tu-time{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:6px}.tu-slider{display:flex;flex-direction:column;flex:1;min-width:140px}.tu-slider input{width:100%}
.tu-settings{margin:12px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.tu-settings .ds-label{display:block;margin-top:6px}

.tu-gauge-wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 18px}
.tu-gauge{width:min(300px,100%);height:auto}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--text);font-family:inherit}
#gate form{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
#gate h1{font-size:1.6rem;font-weight:300;margin:0 0 8px;color:var(--head);display:flex;flex-direction:column}#gate h1 small{font-size:.7rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
#gate input{font-size:1.1rem;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
#gate button{font-size:1.05rem;padding:10px;border-radius:10px;border:0;background:var(--wood);color:#1c1712;font-weight:700}
#gate .gate-err{color:var(--err);min-height:1.2em;margin:0}
.dy{margin:12px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.dy-head{display:flex;align-items:baseline;gap:12px}
.dy-now{font-size:2.2rem;font-weight:800;font-style:italic;font-family:Georgia,serif;min-width:3ch;text-shadow:0 0 12px currentColor}
.dy-bar{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:8px 0 6px}
.dy-seg{transition:background .4s,box-shadow .4s,opacity .4s;text-align:center;font:italic 700 .85rem Georgia,serif;padding:6px 0;border-radius:6px;color:var(--text);background:color-mix(in srgb,var(--c) 22%,transparent);opacity:.75}
.dy-seg.on{background:var(--c);color:#111;opacity:1;box-shadow:0 0 12px var(--c)}
.dy-needle{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--text);transition:left .5s ease-out}
.dy-chart{display:flex;gap:6px;margin:6px 0 8px}
.dy-labels{display:flex;flex-direction:column-reverse;justify-content:space-around;font:italic 700 .8rem Georgia,serif;min-width:2.4em;text-align:right}
.dy-trace{display:block;flex:1;width:100%;height:min(46vh,260px);border-radius:8px;background:var(--bg)}
.dy-shift{margin:2px 0 4px}
.dy .dy-shift input{display:block;width:100%;max-width:none;margin:0}.dy-ends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.dy-result{margin:10px 0}
.tu-cam{position:relative;margin:10px 0;border-radius:12px;overflow:hidden;background:#000}
.tu-cam video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.tu-cam canvas{display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}
.tu-video{display:block;width:100%;max-height:60vh;margin:6px 0;border-radius:10px;background:#000}
.tu-big{display:flex;flex-direction:column;align-items:center;min-width:150px}
.tu-big .tu-note{font-size:3.4rem;line-height:1;min-width:0}
.tu-verdict{font-size:1.25rem;font-weight:700;color:var(--muted)}
.tu-verdict.ok{color:var(--ok)}.tu-verdict.tief{color:var(--tu-low)}.tu-verdict.hoch{color:var(--tu-high)}
.tu-live.ok .tu-note{color:var(--ok)}
.tu-live.ok .tu-note{text-shadow:0 0 14px color-mix(in srgb,var(--ok) 55%,transparent)}
.tu-live.tief .tu-note{color:var(--tu-low);text-shadow:0 0 14px color-mix(in srgb,var(--tu-low) 55%,transparent)}
.tu-live.hoch .tu-note{color:var(--tu-high);text-shadow:0 0 14px color-mix(in srgb,var(--tu-high) 55%,transparent)}
.mt-bars{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:4px 0}
.mt-bar{padding:2px 8px;border-radius:6px;border:1px solid var(--line);font-size:.85rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.mt-bar.on{background:var(--brass-soft);border-color:var(--brass);color:var(--text)}
.mt-dot.small{width:12px;height:12px;margin:3px 0}
.mt-dot.grp{border-color:var(--wood);border-width:2px}
.mt-dots{gap:2px}
.mt-dot-btn{background:none;border:0;padding:6px;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:34px;min-height:34px;-webkit-tap-highlight-color:transparent}
.mt-dot-btn .mt-dot{width:22px;height:22px}
.mt-dot-btn .mt-dot.small{width:15px;height:15px;margin:0}
.mt-dot.off{background:transparent;border:1.5px dashed var(--muted);opacity:.75;position:relative}
.mt-dot.off::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--line);transform:rotate(45deg);background:var(--muted)}
.mt-dot.off.on{background:transparent;opacity:.8}
.mt-dots-hint{text-align:center;font-size:12px;color:var(--muted, #9a8f80);margin:0 0 8px}
.mt-meter{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.mt-blocks{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.mt-blocks .ds-chip{min-width:0;padding:4px 8px;font-size:.85rem}
.mt-own{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}

.ds-bg{position:absolute;top:28px;right:2px;display:flex;gap:6px}.ds-bg button{width:16px;height:16px;padding:0;border-radius:50%;border:1px solid var(--muted);cursor:pointer}.ds-bg button.active{outline:2px solid var(--hl);outline-offset:2px}
/* Schrift */
:root{--font-text:"Jost",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,sans-serif;--font-display:"Cormorant Garamond",Georgia,"Times New Roman",serif}
body{font-family:var(--font-text);letter-spacing:.01em}
.ds-title,.ds-app,.ds-sub,.home-name,.ds-note,.ds-note-sm,.mt-num,.mt-mini-bpm,.tu-note,.tu-result h4,.mt-own summary,#gate h1{font-family:var(--font-display);font-variant-numeric:lining-nums}
.ds-app,#gate h1{font-weight:600;letter-spacing:.015em}
.ds-app{font-size:2rem}
.ds-sub{font-size:1.45rem;font-weight:600}
.home-name{font-size:1.45rem;font-weight:600}

.tu-note{font-size:3.3rem}.tu-big .tu-note{font-size:3.8rem}
.ds-brand{letter-spacing:.24em}

<body>
<div id="root"></div>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/Tone.js"></script>
<script src="gate.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  // Neue Version geladen: sofort anzeigen, solange noch nichts angetippt wurde
  let touched = false;
  window.addEventListener("pointerdown", () => (touched = true), { once: true });
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!navigator.serviceWorker.controller) return;
    if (!touched) return location.reload();
    // App wird schon benutzt: Hinweis zum Neuladen statt mitten im Üben neu zu starten
    if (document.getElementById("tl-update")) return;
    const b = document.createElement("button");
    b.id = "tl-update";
    b.textContent = "Neue Version – hier tippen zum Laden";
    b.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;padding:12px 18px;border-radius:999px;border:0;background:#b8892c;color:#1c1712;font:600 15px system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.5)";
    b.onclick = () => location.reload();
    document.body.appendChild(b);
  });
}
</script>
</body>
